version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: tpcds_sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - tpcds_shared_data:/workspace
      - ./tpcds-kit:/tpcds-kit
      - ./scripts:/scripts
      - ./data:/data
      - ./benchmark_results:/benchmark_results
      - mssql_data:/var/opt/mssql

  workspace:
    build:
      context: .
      dockerfile: Dockerfile.workspace
    container_name: tpcds_workspace
    environment:
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
    depends_on:
      - sqlserver
    volumes:
      - tpcds_shared_data:/workspace
      - ./tpcds-kit:/tpcds-kit
      - ./scripts:/scripts
      - ./data:/data

volumes:
  tpcds_shared_data:
  mssql_data: