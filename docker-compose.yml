version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: tpcds_sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - tpcds_shared_data:/workspace
      - ./scripts:/scripts
      - ./tpcds-kit:/tpcds-kit
      - ./optimized_queries:/optimized_queries
      - mssql_data:/var/opt/mssql

  workspace:
    image: ubuntu:22.04
    container_name: tpcds_workspace
    environment:
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
    depends_on:
      - sqlserver
    command:
      - bash
      - -c
      - |
        apt-get update &&
        DEBIAN_FRONTEND=noninteractive apt-get install -y gcc make bison byacc flex python3 python3-pip &&
        tail -f /dev/null
    volumes:
      - ./tpcds-kit:/tpcds-kit
      - ./scripts:/scripts
      - tpcds_shared_data:/workspace
      - ./optimized_queries:/optimized_queries

volumes:
  tpcds_shared_data:
  mssql_data: