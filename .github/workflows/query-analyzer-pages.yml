name: Publish query analyzer

# Publishing is deliberate: enable Pages in repository settings and run manually.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: query-analyzer-pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -B -m unittest discover -s tools/query_analyzer/tests
      - run: python -B -m tools.query_analyzer build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: tools/query_analyzer/site
  deploy:
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
